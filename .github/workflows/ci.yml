name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - run: nix flake check -L

  # Builds the archives into a draft release, which smoke tests before publish.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser writes the release notes from the history since the last tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - run: nix develop -c goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    needs: release
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, archive: paris-transit-mcp_linux_amd64.tar.gz, bin: paris-transit-mcp }
          - { runner: ubuntu-24.04-arm, archive: paris-transit-mcp_linux_arm64.tar.gz, bin: paris-transit-mcp }
          - { runner: macos-15-intel, archive: paris-transit-mcp_darwin_amd64.tar.gz, bin: paris-transit-mcp }
          - { runner: macos-latest, archive: paris-transit-mcp_darwin_arm64.tar.gz, bin: paris-transit-mcp }
          - { runner: windows-latest, archive: paris-transit-mcp_windows_amd64.zip, bin: paris-transit-mcp.exe }
          - { runner: windows-11-arm, archive: paris-transit-mcp_windows_arm64.zip, bin: paris-transit-mcp.exe }
    runs-on: ${{ matrix.runner }}
    # Only a token that can write sees a draft release.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      ARCHIVE: ${{ matrix.archive }}
      BIN: ${{ matrix.bin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download
        run: gh release download "$GITHUB_REF_NAME" -p "$ARCHIVE" -p checksums.txt -D release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and unpack
        working-directory: release
        run: |
          line=$(awk -v f="$ARCHIVE" '$2 == f' checksums.txt)
          [[ -n $line ]] || { echo "$ARCHIVE is not in checksums.txt" >&2; exit 1; }
          if command -v sha256sum >/dev/null; then
            sha256sum -c - <<<"$line"
          else
            shasum -a 256 -c - <<<"$line"
          fi
          if [[ $ARCHIVE == *.zip ]]; then
            pwsh -NoProfile -Command "Expand-Archive -LiteralPath \$env:ARCHIVE -DestinationPath ."
          else
            tar -xzf "$ARCHIVE"
          fi
      - name: Smoke test
        run: bash scripts/smoke.sh "release/$BIN" "$GITHUB_REF_NAME"

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
